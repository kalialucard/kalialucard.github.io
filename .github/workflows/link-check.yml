name: Link Check

on:
  pull_request:
    branches: [main]

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Migrate content
        run: node scripts/migrate-content.mjs

      - name: Generate redirects
        run: node scripts/generate-redirects.mjs

      - name: Build
        run: npm run build

      - name: Verify build (banned strings)
        run: node scripts/verify-build.mjs

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --base "${{ github.workspace }}/dist"
            --no-progress
            --exclude-loopback
            --exclude "^mailto:"
            --exclude "^https?://(hackerone|hackenproof|hackthebox|tryhackme|cantina|remedy)\."
            --exclude "^https://samindrasamiya\.site"
            --exclude "^https?://(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|0\.0\.0\.0)"
            "${{ github.workspace }}/dist/**/*.html"
          fail: true
