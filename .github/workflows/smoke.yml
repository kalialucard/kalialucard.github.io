name: Post-Deploy Smoke Test

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to test"
        default: "https://samindrasamiya.site"

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.event.inputs.base_url || 'https://samindrasamiya.site' }}

    steps:
      - name: Wait for CDN propagation
        run: sleep 15

      - name: Assert / — Astro generator tag present
        run: |
          body=$(curl -sf "$BASE/")
          echo "$body" | grep -q 'name="generator"' || { echo "FAIL: missing generator meta"; exit 1; }
          echo "$body" | grep -qi 'astro' || { echo "FAIL: not an Astro page"; exit 1; }
          echo "PASS: / serves Astro page"

      - name: Assert / — no banned strings
        run: |
          body=$(curl -sf "$BASE/")
          for banned in "Access_Level" "Technical Intelligence" "Encryption_Status" "Signal_Strength" \
                        "System_Status" "Beginner Analysis" "Certifications" "issued_to" \
                        "No public write-ups yet" "aspiring professionals"; do
            if echo "$body" | grep -q "$banned"; then
              echo "FAIL: banned string found on /: $banned"
              exit 1
            fi
          done
          echo "PASS: no banned strings on /"

      - name: Assert /about/ — real page (not redirect)
        run: |
          body=$(curl -sf "$BASE/about/")
          echo "$body" | grep -q 'name="generator"' || { echo "FAIL: /about/ not an Astro page"; exit 1; }
          len=$(echo "$body" | wc -c)
          [ "$len" -gt 2000 ] || { echo "FAIL: /about/ too short ($len bytes) — probably a redirect stub"; exit 1; }
          echo "PASS: /about/ serves real page ($len bytes)"

      - name: Assert /contact/ — real page
        run: |
          body=$(curl -sf "$BASE/contact/")
          echo "$body" | grep -q 'name="generator"' || { echo "FAIL: /contact/ not an Astro page"; exit 1; }
          len=$(echo "$body" | wc -c)
          [ "$len" -gt 2000 ] || { echo "FAIL: /contact/ too short ($len bytes)"; exit 1; }
          echo "PASS: /contact/ serves real page ($len bytes)"

      - name: Assert /credentials/ — real page
        run: |
          body=$(curl -sf "$BASE/credentials/")
          echo "$body" | grep -q 'name="generator"' || { echo "FAIL: /credentials/ not an Astro page"; exit 1; }
          len=$(echo "$body" | wc -c)
          [ "$len" -gt 2000 ] || { echo "FAIL: /credentials/ too short ($len bytes)"; exit 1; }
          # Must not contain the word Certifications
          echo "$body" | grep -qi "Certifications" && { echo "FAIL: /credentials/ contains banned word 'Certifications'"; exit 1; }
          echo "PASS: /credentials/ serves real page ($len bytes)"

      - name: Assert /policy/ — real page
        run: |
          body=$(curl -sf "$BASE/policy/")
          echo "$body" | grep -q 'name="generator"' || { echo "FAIL: /policy/ not an Astro page"; exit 1; }
          echo "$body" | grep -qi "Disclosure" || { echo "FAIL: /policy/ missing expected content"; exit 1; }
          echo "PASS: /policy/ serves real page"

      - name: Assert /labs/ — real page
        run: |
          body=$(curl -sf "$BASE/labs/")
          echo "$body" | grep -q 'name="generator"' || { echo "FAIL: /labs/ not an Astro page"; exit 1; }
          echo "PASS: /labs/ serves real page"

      - name: Assert /labs/tryhackme/ — section page exists
        run: |
          body=$(curl -sf "$BASE/labs/tryhackme/")
          echo "$body" | grep -q 'name="generator"' || { echo "FAIL: /labs/tryhackme/ not an Astro page"; exit 1; }
          echo "PASS: /labs/tryhackme/ serves real page"

      - name: Assert /certs/ — redirects to /credentials/
        run: |
          body=$(curl -sf "$BASE/certs/")
          # Should either redirect (follow) to /credentials/ or be a redirect stub
          echo "$body" | grep -qi 'credentials\|Redirect' || { echo "FAIL: /certs/ not redirecting to /credentials/"; exit 1; }
          echo "PASS: /certs/ redirects to /credentials/"

      - name: Assert /research/ — redirects to /policy/
        run: |
          body=$(curl -sf "$BASE/research/")
          echo "$body" | grep -qi 'policy\|Redirect' || { echo "FAIL: /research/ not redirecting to /policy/"; exit 1; }
          echo "PASS: /research/ redirects to /policy/"

      - name: Assert /robots.txt — exists and has Sitemap
        run: |
          body=$(curl -sf "$BASE/robots.txt")
          echo "$body" | grep -qi 'sitemap' || { echo "FAIL: robots.txt missing Sitemap line"; exit 1; }
          echo "PASS: robots.txt present with Sitemap"

      - name: Assert /.well-known/security.txt — exists and well-formed
        run: |
          body=$(curl -sf "$BASE/.well-known/security.txt")
          echo "$body" | grep -qi 'expires' || { echo "FAIL: security.txt missing Expires field"; exit 1; }
          echo "$body" | grep -qi 'policy' || { echo "FAIL: security.txt missing Policy field"; exit 1; }
          # Must NOT contain legal name
          echo "$body" | grep -qi 'sanjaya' && { echo "FAIL: security.txt contains legal name info"; exit 1; }
          echo "PASS: security.txt well-formed"

      - name: Assert redirect stubs — 200 not 404
        run: |
          for path in /about.html /certificates.html /devhub.html /writeups.html /projects.html; do
            code=$(curl -so /dev/null -w "%{http_code}" "$BASE$path")
            [ "$code" = "200" ] || { echo "FAIL: $path returned $code"; exit 1; }
            echo "PASS: $path → $code"
          done

      - name: Assert og.png — exists
        run: |
          code=$(curl -so /dev/null -w "%{http_code}" "$BASE/og.png")
          [ "$code" = "200" ] || { echo "FAIL: /og.png returned $code"; exit 1; }
          echo "PASS: /og.png → $code"

      - name: Link check — crawl live site
        uses: lycheeverse/lychee-action@v1
        with:
          args: >
            --no-progress
            --exclude-loopback
            --exclude "mailto:"
            --exclude "^https://tryhackme\\.com"
            --exclude "^https://hackerone\\.com"
            --exclude "^https://hackenproof\\.com"
            --exclude "^https://app\\.hackthebox\\.com"
            --exclude "^https://coursera\\.org"
            --exclude "^https://www\\.credly\\.com"
            --max-concurrency 4
            --timeout 20
            ${{ env.BASE }}
          fail: true
        continue-on-error: true  # link check is advisory; don't block deploy
